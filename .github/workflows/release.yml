name: Runtime Preview package preparation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact Runtime source commit (40 lowercase hex)
        required: true
        type: string
      source_run_id:
        description: Successful Runtime ci.yml run ID
        required: true
        type: string
      expected_artifact_digest:
        description: SHA256 of the original source-CI artifact ZIP
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-v0.9.0-package-preparation
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  EXPECTED_ARTIFACT_DIGEST: ${{ inputs.expected_artifact_digest }}
jobs:
  prepare:
    if: github.repository == 'yeliang-wang/evopilot-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install locked preparation dependencies without scripts
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Retain original source-CI distribution without rebuilding
        id: prepare
        run: node scripts/release-gate.mjs prepare-ci
      # No private acceptance, decision, notes, logs or failure evidence upload.
      # Full local preflight and real operator authentication remain mandatory.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifactName }}
          path: |
            ${{ runner.temp }}/runtime-release-preparation/assets/SHA256SUMS
            ${{ runner.temp }}/runtime-release-preparation/assets/distribution-manifest.json
            ${{ runner.temp }}/runtime-release-preparation/assets/evopilot-next-runtime-0.9.0.tgz
            ${{ runner.temp }}/runtime-release-preparation/assets/evopilot-runtime-0.9.0-darwin-arm64.tar.gz
            ${{ runner.temp }}/runtime-release-preparation/assets/runtime-dependency-lock.json
            ${{ runner.temp }}/runtime-release-preparation/assets/source-revision.txt
          if-no-files-found: error
          retention-days: 14
